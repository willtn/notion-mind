name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v3.8 or 3.8)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            # Remember the exact tag that triggered us so we can retire it if
            # normalization renames it (e.g. a pushed v6.2 → released v6.2.0),
            # rather than leaving a stale 2-component duplicate behind.
            echo "TRIGGER_TAG=$VERSION" >> "$GITHUB_ENV"
          fi
          [[ "$VERSION" =~ ^v ]] || VERSION="v$VERSION"

          # Normalize to 3-component semver so the tag matches the manifest
          # version: v6 → v6.0.0, v6.2 → v6.2.0, v6.2.1 stays.
          if [[ "$VERSION" =~ ^v[0-9]+$ ]]; then
            VERSION="${VERSION}.0.0"
          elif [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION (accepted inputs: vX, vX.Y, or vX.Y.Z, with or without the leading v)"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stage release tag locally (manual trigger only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Refuse to clobber a version that actually SHIPPED — and a tag alone
          # is not proof that it did. The last step of this job is a network
          # call to the releases API, so a run can push the tag, bump the
          # manifest, and then fail to publish. That state has to stay
          # retryable, and gating on the tag made it permanent: the retry died
          # here, four steps before the one that actually failed.
          #
          # The RELEASE object is what distinguishes "already released" from
          # "half-released", so that is what this checks.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION is already released"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::notice::Tag $VERSION exists with no release — resuming a partial run"
          fi
          # Create the tag LOCALLY (not pushed) before generate-changelog runs.
          # The script derives the previous release as the second-newest tag,
          # which assumes the current release tag exists; without it prevTag
          # would be off by one (wrong changelog range + fingerprint diff). The
          # "Tag the release commit" step later moves this onto the bump commit
          # and force-pushes it. The push:tags trigger already has its tag
          # locally from checkout, so only the dispatch path needs this.
          #
          # -f because a resumed run's checkout already carries the tag it
          # pushed last time.
          git tag -f "$VERSION"

      # Tests run exactly as test.yml runs them, so a release can never test
      # something CI did not.
      - name: Run tests
        working-directory: .claude/scripts
        run: npm test

      - name: Generate changelog
        run: |
          node --experimental-strip-types .github/scripts/generate-changelog.ts "$VERSION" > /tmp/changelog_section.md

      - name: Build release body
        run: |
          cat > /tmp/release_body.md <<'HEADER'
          ## Quick Start

          **Requirements:** a [Notion](https://www.notion.com) workspace, [Node 22.6+](https://nodejs.org), [mcporter](https://github.com/openclaw/mcporter) with a Notion login, and [Claude Code](https://claude.ai/code)

          **Clone and set up:**

          ```bash
          git clone https://github.com/breferrari/obsidian-mind.git
          cd obsidian-mind
          mcporter config add notion https://mcp.notion.com/mcp
          mcporter auth notion
          node --experimental-strip-types .claude/scripts/notion-setup.ts
          ```

          The setup makes the databases, the views, and the pages under one root page, and writes `notion-map.json`. Then run `claude` in the directory and type `/om-standup`.

          **Already using obsidian-mind?** Run `git pull` in your clone. To copy the notes of an Obsidian vault into Notion, run the setup, then `node --experimental-strip-types .claude/scripts/notion-import.ts --vault <path> --dry-run`, then the same command without `--dry-run`.

          HEADER
          # Strip leading whitespace from heredoc
          sed -i 's/^          //' /tmp/release_body.md
          cat /tmp/changelog_section.md >> /tmp/release_body.md

      - name: Commit changelog and manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md vault-manifest.json
          if [ -f .claude/skills/obsidian-mind/.claude-plugin/plugin.json ]; then
            git add .claude/skills/obsidian-mind/.claude-plugin/plugin.json
          fi
          # A resumed run finds the changelog and manifests already at $VERSION,
          # so nothing stages and `git commit` exits 1 — which under `bash -e`
          # killed the job here rather than at whatever actually failed. Ask the
          # index instead: `git commit`'s exit code cannot tell "already done"
          # from "failed to do", and only one of those is an error.
          #
          # NOT --allow-empty: that also clears the abort, at the cost of an
          # empty commit on main for every retry.
          if git diff --cached --quiet; then
            echo "::notice::CHANGELOG and manifests already at $VERSION — nothing to commit"
          else
            git commit -m "release: update CHANGELOG and manifests for $VERSION"
          fi
          # Outside the branch on purpose: a resumed run is already in sync and
          # this is a cheap no-op, but a previous attempt that committed and
          # died before pushing is recovered by exactly this line.
          git push origin main

      - name: Tag the release commit
        run: |
          # Point the tag at the version-bump commit so the tagged tree carries
          # its own version (plugin.json + vault-manifest.json), so a tag whose
          # tree lags its name mislabels the release. -f / --force handles the
          # push:tags trigger, where a human-pushed tag already points at the
          # pre-bump commit; we move it forward to the bump commit. (Tag pushes
          # via GITHUB_TOKEN don't re-trigger this workflow.)
          git tag -f "$VERSION"
          git push origin "refs/tags/$VERSION" --force
          # If a 2-component tag triggered this run (push:tags of v6.2), retire
          # it now that the canonical 3-component tag (v6.2.0) points at the
          # bump commit — otherwise the old name lingers on the pre-bump commit.
          if [ -n "${TRIGGER_TAG:-}" ] && [ "$TRIGGER_TAG" != "$VERSION" ]; then
            git push origin ":refs/tags/$TRIGGER_TAG" || true
          fi

      - name: Verify tagged tree version matches the tag
        run: |
          # Regression guard for the skew this reordering fixes: the tagged tree
          # must carry its own version. VERSION is 3-component already; the case
          # is belt-and-suspenders.
          want="${VERSION#v}"
          case "$want" in *.*.*) ;; *.*) want="${want}.0" ;; esac

          # vault-manifest.json exists in every vault — always verify it.
          manifest=$(git show "$VERSION:vault-manifest.json" | sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          echo "tag=$VERSION expected=$want vault-manifest=$manifest"
          if [ "$manifest" != "$want" ]; then
            echo "::error::Tagged vault-manifest version=$manifest, expected $want"
            exit 1
          fi

          # The mod's plugin.json carries the template's version too (optional).
          plugin_path=".claude/skills/obsidian-mind/.claude-plugin/plugin.json"
          if git cat-file -e "$VERSION:$plugin_path" 2>/dev/null; then
            plugin=$(git show "$VERSION:$plugin_path" | sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
            echo "plugin.json=$plugin"
            if [ "$plugin" != "$want" ]; then
              echo "::error::Tagged plugin.json version=$plugin, expected $want"
              exit 1
            fi
          fi

      - name: Create or update release
        run: |
          if gh release view "$VERSION" &>/dev/null; then
            gh release edit "$VERSION" --notes-file /tmp/release_body.md
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file /tmp/release_body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
